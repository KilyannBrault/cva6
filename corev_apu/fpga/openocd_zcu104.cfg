# OpenOCD configuration for CV64A6 on ZCU104
# Use FTDI adapter
adapter driver ftdi
# Check the VID/PID of your FTDI device using `lsusb` or `dmesg` like
# 'Future Technology Devices International, Ltd FT4232H Quad HS USB-UART/FIFO IC'
ftdi vid_pid 0x0403 0x6010
# USB channel 0 is used for JTAG, see the documentation from Xilinx ZCU104 User Guide:
# https://docs.amd.com/api/khub/documents/g76en4BfB6qIp2gHDRkQxg/content?Ft-Calling-App=ft%2Fturnkey-portal&Ft-Calling-App-Version=5.3.24#G5.688775
ftdi channel 0
# Set the FTDI interface to MPSSE mode with TCK/SK, TDI/DO, TDO/DI, and TMS/CS
ftdi layout_init 0x0088 0x008b
# 25000 kHz / 25 MHz JTAG bus speed
adapter speed 25000
# Select the JTAG transport protocol
transport select jtag

# PS DAP — IR length 4
jtag newtap zynqmp dap -irlen 4 -expected-id 0x5BA00477 -ignore-version

# PL TAP — IR length 12
jtag newtap xczu7ev tap -irlen 12 -expected-id 0x14730093 -ignore-version
# RISC-V TAP — IR length 5
target create cv64a6 riscv -chain-position xczu7ev.tap -coreid 0
# Set the IR for the DTM and DMI registers
riscv set_ir idcode 0x09
riscv set_ir idcode 0x05
riscv set_ir dtmcs  0x22
riscv set_ir dmi    0x23

# Timeout settings
riscv set_command_timeout_sec 1
riscv set_reset_timeout_sec 1

# Run a GDB server on port 3333
gdb_port 3333

# Initialize OpenOCD and directly halt the target
init
targets
halt
